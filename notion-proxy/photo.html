<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: transparent; display: flex; 
            justify-content: center; align-items: center;
        }
        #error-box {
            display: none; padding: 15px; background: #fff3f3; 
            border: 1px solid #ffcdd2; border-radius: 6px; 
            color: #c62828; font-family: sans-serif; font-size: 13px; 
            text-align: center; max-width: 90%;
        }
        img { 
            width: 100%; height: 100%; object-fit: cover; 
            border-radius: 8px; display: none; opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="error-box"></div>
    <img id="random-image" alt="Notion Photo Roulette">

    <script>
        // Change tag query parameter here if desired
        const API_ENDPOINT = "/api/photos?tag=Hot+Chicks"; 
        
        const errorBox = document.getElementById('error-box');
        const img = document.getElementById('random-image');

        async function loadPhotoRoulette() {
            try {
                const res = await fetch(API_ENDPOINT);
                if (!res.ok) throw new Error(`Server returned HTTP ${res.status}`);
                
                const items = await res.json();
                
                if (!items || items.length === 0) {
                    errorBox.innerHTML = "<b>No photos found.</b> Check tag name or 'Files & Media' column.";
                    errorBox.style.display = 'block';
                    return;
                }
                
                // Anti-Repeat Randomizer Logic
                let randomIndex = Math.floor(Math.random() * items.length);
                const lastSeenUrl = localStorage.getItem('notion_roulette_last_seen');
                
                if (items.length > 1 && items[randomIndex].url === lastSeenUrl) {
                    randomIndex = (randomIndex + 1) % items.length;
                }
                
                const selectedItem = items[randomIndex];
                
                // Save state for anti-repeat and cross-widget title broadcasting
                localStorage.setItem('notion_roulette_last_seen', selectedItem.url);
                localStorage.setItem('shared_photo_name', selectedItem.title);
                
                // Set image source and reveal when loaded
                img.src = selectedItem.url;
                img.onload = () => {
                    img.style.display = 'block';
                    img.style.opacity = '1';
                };
                
                img.onerror = () => {
                    errorBox.innerHTML = "<b>Image Load Error:</b> Browser blocked external render (Notion direct uploads expire via AWS S3). Use direct external image links.";
                    errorBox.style.display = 'block';
                };

            } catch (err) {
                errorBox.innerHTML = `<b>Connection Error:</b> ${err.message}`;
                errorBox.style.display = 'block';
            }
        }
        
        window.onload = loadPhotoRoulette;
    </script>
</body>
</html>
